<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contactez-nous pour toute question sur nos ustensiles de cuisine.">
  <title>Contact — E-varotra</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-base="../">

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="../index.html">E-<span>VAROTRA</span></a>
      <nav class="main-nav">
        <a href="../index.html">Accueil</a>
        <a href="produits.html">Produits</a>
        <a href="guides.html">Guides d'achat</a>
        <a href="contact.html" class="active">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container section">
    <h1>Contact</h1>
    <p class="muted">Une question sur un produit ? Écrivez-nous, nous répondons sous 48 h.</p>

    <form id="contact-form" class="contact" style="margin-top:32px">
      <label>Nom
        <input type="text" name="nom" required>
      </label>
      <label>E-mail
        <input type="email" name="email" required>
      </label>
      <label>Produit concerné (optionnel)
        <select name="produit" id="produit-select">
          <option value="">Aucun produit en particulier</option>
        </select>
      </label>
      <label>Message
        <textarea name="message" rows="6" required></textarea>
      </label>
      <button type="submit" class="btn btn-primary">Envoyer</button>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>© 2026 E-varotra</span>
      <span><a href="produits.html">Produits</a> · <a href="guides.html">Guides</a> · Mentions légales à compléter</span>
    </div>
  </footer>

  <script src="../js/main.js"></script>
</body>
</html>
