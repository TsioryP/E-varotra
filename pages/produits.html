<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Catalogue complet des ustensiles de cuisine : filtrez par univers, marque et prix.">
  <title>Produits — E-varotra</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-base="../">

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="../index.html">E-<span>VAROTRA</span></a>
      <nav class="main-nav">
        <a href="../index.html">Accueil</a>
        <a href="produits.html" class="active">Produits</a>
        <a href="guides.html">Guides d'achat</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container section">
    <h1>Produits</h1>
    <p class="muted">Filtrez le catalogue pour trouver l'outil qu'il vous faut.</p>

    <div class="filters">
      <label>Univers
        <select id="filter-categorie"><option value="">Tous</option></select>
      </label>
      <label>Marque
        <select id="filter-marque"><option value="">Toutes</option></select>
      </label>
      <label>Prix maximum : <strong id="prix-val"></strong>
        <input type="range" id="filter-prix" min="0" max="200" step="5">
      </label>
      <label>Trier par
        <select id="tri">
          <option value="pertinence">Pertinence</option>
          <option value="prix-asc">Prix croissant</option>
          <option value="prix-desc">Prix décroissant</option>
        </select>
      </label>
    </div>

    <p id="compteur" class="muted"></p>
    <div id="liste" class="grid grid-4"></div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>© 2026 E-varotra</span>
      <span><a href="contact.html">Contact</a> · <a href="guides.html">Guides</a> · Mentions légales à compléter</span>
    </div>
  </footer>

  <script src="../js/main.js"></script>
  <script src="../js/produits.js"></script>
</body>
</html>
